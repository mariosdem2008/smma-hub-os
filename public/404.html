<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SMMAHUB</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var normalized = path.startsWith("/") ? path.slice(1) : path;
        window.location.replace("/?p=/" + normalized);
      })();
    </script>
  </head>
  <body></body>
</html>
