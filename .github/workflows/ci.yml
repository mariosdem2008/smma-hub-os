name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Map secrets to env once: the `secrets` context is NOT allowed in step
    # `if:` conditions (using it there invalidates the whole workflow at startup,
    # which is why every CI run silently failed). Optional staging-backed gates
    # below gate on `env.*` instead.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WF_CLIENT_DETAIL_BASE_URL: ${{ secrets.WF_CLIENT_DETAIL_BASE_URL }}
      WF_CLIENT_ONBOARDING_BASE_URL: ${{ secrets.WF_CLIENT_ONBOARDING_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject large files (>10MB)
        shell: bash
        run: |
          set -euo pipefail
          max=$((10*1024*1024))
          echo "Checking tracked files..."
          tracked=$(git ls-files -z)
          if [ -n "$tracked" ]; then
            while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              size=$(wc -c <"$f")
              if [ "$size" -gt "$max" ]; then
                echo "Tracked file too large: $size $f"
                exit 1
              fi
            done < <(printf '%s' "$tracked")
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking PR diff..."
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              size=$(wc -c <"$f")
              if [ "$size" -gt "$max" ]; then
                echo "PR adds large file: $size $f"
                exit 1
              fi
            done < <(git diff --name-only --diff-filter=AM -z "$base" "$head")
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Traceability gate (AI onboarding phase 0)
        run: npm run traceability:ai-guided-onboarding:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Onboarding golden quality gate (staging-backed, optional)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run quality:onboarding:golden:gate

      - name: Install Playwright Chromium (client-detail gate)
        if: ${{ env.WF_CLIENT_DETAIL_BASE_URL != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npx playwright install --with-deps chromium

      - name: Client-detail deep quality gate (staging-backed, optional)
        if: ${{ env.WF_CLIENT_DETAIL_BASE_URL != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          WF_CLIENT_DETAIL_BASE_URL: ${{ secrets.WF_CLIENT_DETAIL_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run quality:client-detail:deep:gate

      - name: Install Playwright Chromium (client-onboarding chat gate)
        if: ${{ env.WF_CLIENT_ONBOARDING_BASE_URL != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npx playwright install --with-deps chromium

      - name: Client-onboarding chat quality gate (staging-backed, optional)
        if: ${{ env.WF_CLIENT_ONBOARDING_BASE_URL != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          WF_CLIENT_ONBOARDING_BASE_URL: ${{ secrets.WF_CLIENT_ONBOARDING_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run quality:client-onboarding:chat:gate
